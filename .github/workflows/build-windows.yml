name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'frontend/yarn.lock'

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --network-timeout 1000000

      - name: Build React app
        working-directory: ./frontend
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: 'true'
        run: yarn build

      - name: Package Electron app for Windows
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn electron:pack

      - name: List dist folder
        if: always()
        working-directory: ./frontend
        run: |
          echo "--- dist folder content ---"
          dir dist
        shell: cmd

      - name: Upload Windows installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: DinarDesk-Windows-Installer
          path: |
            frontend/dist/DinarDesk-Setup-*.exe
            frontend/dist/*.exe.blockmap
            frontend/dist/latest.yml
          if-no-files-found: error
          retention-days: 90

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DinarDesk-Portable
          path: frontend/dist/DinarDesk-Portable-*.exe
          if-no-files-found: error
          retention-days: 90
